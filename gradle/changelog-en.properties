# English translations for the CurseForge changelog.
#
# generateChangelog renders each commit subject (and its "- " bullets) from git; this table then
# replaces every line whose Chinese text contains a key. Keys are matched as substrings, so keep
# them specific enough that they cannot collide across commits.
#
# A line with no entry keeps its Chinese text, so a missing translation shows up in the release
# notes instead of being silently dropped. Add entries as commits land.
1.0.17.5:改用 common/6.9.0/6.17.0 三模块构建，替换 Stonecutter=1.0.17.5: Replaced Stonecutter with a common / 6.9.0 / 6.17.0 three-module build
用 Gradle 多项目替代 Stonecutter 条件注释：common 存放全部共享代码，=Replaced Stonecutter conditional comments with a Gradle multi-project: :common holds all shared code, and the version modules hold only what differs, so each Tetra version builds independently
删除 stonecutter.gradle.kts 与 versions/：Stonecutter 插件要求 Gradle 守护进程=Removed stonecutter.gradle.kts and versions/: the Stonecutter plugin required the Gradle daemon to run on JDK 21, which pushed the debug environment off the JDK 17 that 1.20.1 should use
版本差异收敛到唯一接缝：IModularItem.getImprovementName 在 6.10 起多了 ItemStack=Version differences collapsed into a single seam: IModularItem.getImprovementName gained an ItemStack parameter in 6.10, so :common depends only on the IImprovementNameResolver interface, each version module implements it, and both register through ServiceLoader
编译产物回到 Java 17 字节码（toolchain 显式设为 17）；此前 toolchain 被改成 21，=Compiled output is Java 17 bytecode again (toolchain pinned to 17); it had been raised to 21, so classes were major version 65 and a Java 17 client threw UnsupportedClassVersionError
三个模块共用 MixinExtras 与 YiRanExpressionLib，统一在根 subprojects 声明：=MixinExtras and YiRanExpressionLib are declared once for all three modules in the root subprojects block: jarJar does not travel through a project dependency, so every module must re-embed them or the jar builds fine but fails to load at runtime
修正 YiRanExpressionLib 未被嵌入的问题（此前只有各版本单独声明，=Fixed YiRanExpressionLib not being embedded: :common uses Expressions but only the version modules declared the library
mods.toml 改为按模块生成，tetra versionRange 用真实区间：=mods.toml is now generated per module, with a real Tetra version range: [6.9.0, 6.10) for 6.9.0 and [6.17.0, ) for 6.17.0
模块版本号统一为 <base>-<tetra 版本>-<拔刀剑版本>，后段改用 slashblade_version 命名=Module versions unified as <base>-<Tetra version>-<SlashBlade version>, with the last segment read from slashblade_version
.gitignore 补充多模块产物规则（根 build 规则不覆盖子项目）=.gitignore gained multi-module output rules, because the root build rule does not cover subprojects
修复ciallo原理图无法使用的问题 修正拔刀剑属性修饰符，可以在副手举盾吃属性了（=Fixed CialloBlade schematics being unusable; corrected SlashBlade attribute modifiers so offhand shield-blocking still applies them
