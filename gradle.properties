# Memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Enabled: the configuration cache was originally disabled because Stonecutter evaluated the shared
# build script once per node and generated sources it could not track. Stonecutter is gone; the
# Minecraft artifacts task and :common's mixin annotation processor both replay correctly from a
# cache entry. If a run configuration ever reports a configuration cache problem, mark just that run
# task notCompatibleWithConfigurationCache instead of turning this off for the whole build.
org.gradle.configuration-cache=true

# Tetra/mutil per version module, in each module's own gradle.properties:
#   tetra_version, tetra_file_id, mutil_file_id, tetra_version_range
#
# :common compiles against the oldest supported API only, so code that compiles here also compiles
# against any later Tetra. Keep these pointing at the lowest supported version.
tetra_api_file_id=6418957
mutil_api_file_id=6418901

# IBE Editor (curse file id) — an in-game block model/state editor used for debugging. The version
# modules load it with modRuntimeOnly, so it is never compiled against and never enters a jar.
ibe_file_id=4994072


parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.29
forge_version_range=[47,)
loader_version_range=[47,)

mod_id=slashbladetetra
mod_name=SlashBladeTetra
mod_license=LGPL-3.0-only
# Module version is composed per module: <base>-<tetra version>-<slashblade version>
mod_version_base=1.0.17.6
slashblade_version=1.9.65
mod_group_id=net.yiran.sbtetra
mod_authors=_yi_ran_
mod_description=I like this.

# CurseForge publishing. Both Tetra version modules upload to this one project; the Tetra version in
# the file name distinguishes the two files.
curseforge_project_id=1294523
curseforge_project_slug=slashbladetetra
# STABLE / BETA / ALPHA — set this per release; there is deliberately no default, because the
# Alpha/Beta/Release badge on CurseForge is a release decision and cannot be changed after upload.
# The build fails loudly if it is missing while publishing.
#publish_type=BETA
# Publishing is a dry run unless this is set to false. Only set it on the command line, for the one
# invocation that should actually upload: -Ppublish_dry_run=false
#publish_dry_run=false
# Overrides the changelog; unset means "See the commit history."
#publish_changelog=
