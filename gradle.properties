# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
# Stonecutter evaluates the shared build script once per node and generates sources,
# which the configuration cache cannot track correctly.
org.gradle.configuration-cache=false


parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.29
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

mod_id=slashbladetetra
mod_name=SlashBladeTetra
mod_license=LGPL-3.0-only
# Full version is derived per node: <base>-<tetra node>-<suffix>
mod_version_base=1.0.17
mod_version_suffix=1.9.65-1
mod_group_id=net.yiran.sbtetra
mod_authors=_yi_ran_
mod_description=I like this.
